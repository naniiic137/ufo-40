name: vita

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version | head -n 1
          cmake --version | head -n 1

      - name: Configure (vitasdk toolchain)
        run: cmake -S . -B build-vita -DUFO40_VITA=ON -DCMAKE_BUILD_TYPE=Release

      # On failure the first compiler/linker errors are echoed as annotations,
      # so they show on the run summary page without downloading logs.
      - name: Build the .vpk
        run: |
          if ! cmake --build build-vita -j2 > build.log 2>&1; then
            cat build.log
            grep -iE "error|undefined reference|No such file|failed" build.log | head -n 6 | sed 's/^/::error::/'
            # the last lines too, for failures that don't say "error" (e.g. a packaging tool)
            tail -n 4 build.log | sed 's/^/::error::/'
            exit 1
          fi
          tail -n 20 build.log

      - name: Check the package
        run: |
          ls -l build-vita/ufo40.vpk
          test -s build-vita/ufo40.vpk

      - uses: actions/upload-artifact@v4
        with:
          name: ufo40-vpk
          path: build-vita/ufo40.vpk
          if-no-files-found: error
